<!doctype html><html lang="zh"><head><meta charset="utf-8"><title>Order Dispatch Tester</title>
<style>body{font:13px sans-serif;margin:8px}fieldset{margin:4px 0}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ccc;padding:2px 4px}
.stuck{background:#fcc}.done{color:#888}#map{display:block;background:#fafafa;cursor:crosshair}#st{height:300px;overflow:auto;border:1px solid #ccc}
#tabbar{display:flex;gap:4px;align-items:center;border-bottom:2px solid #888;margin-bottom:4px}#tabbar button{padding:4px 14px;border:1px solid #888;border-bottom:none;background:#eee;cursor:pointer}
#tabbar button.on{background:#fff;font-weight:bold}#run{margin-left:12px;font-size:12px;color:#333;flex:1}.tab{display:none}.tab.on{display:block}
#rt table{table-layout:fixed}.grp{background:#e8eef5;padding:4px 6px;margin-top:6px;cursor:pointer;font-weight:bold;border:1px solid #bcd}.grp .c{font-weight:normal;margin-left:10px}.dim{color:#999;font-size:11px}
#maptool{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:2px 0}#maptool label{white-space:nowrap}
.row{display:flex;gap:8px}.row>div{flex:1}.S{color:green;font-weight:bold}.E{color:#c00;font-weight:bold}input[type=number]{width:60px}
.chip{display:inline-block;margin:1px 2px;padding:0 2px 0 6px;border-radius:10px;font-size:12px;cursor:pointer;border:1px solid}.chip.hl{outline:2px solid #f80}.chip i{font-style:normal;margin-left:3px;padding:0 4px;border-radius:8px;color:#666}.chip i:hover{background:#c00;color:#fff}
.poolrow{margin:2px 0}.poolrow .pn{display:inline-block;min-width:60px;font-weight:bold}
#steps td{vertical-align:top}#steps tr.off{opacity:.5}#steps tr.drag{outline:2px dashed #69c}#steps textarea{width:100%;box-sizing:border-box;font:11px monospace}#steps textarea.stargs{min-height:8em;height:9.5em;resize:vertical;font:12px/1.35 Consolas,Menlo,monospace;white-space:pre;tab-size:2}
.hdl{cursor:grab;user-select:none;color:#888;font-size:16px}#tpl_prev{max-height:340px;overflow:auto;background:#f6f6f6;font-size:11px;margin:0}.err{color:#c00}.ok{color:green}
#langsel{margin-left:auto}#subbar{display:flex;gap:4px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #69c;padding:2px 0 4px;margin-bottom:4px;position:sticky;top:0;background:#fff;z-index:5}#subbar>button[data-s]{padding:3px 12px;border:1px solid #69c;background:#eef3fa;cursor:pointer}#subbar>button.on{background:#69c;color:#fff;font-weight:bold}#cfgsum{margin-left:12px;font-size:12px}.sub{display:none}.sub.on{display:block}#busy{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9999;align-items:center;justify-content:center;flex-direction:column;color:#fff;font-size:16px;cursor:wait}#busy.on{display:flex}#busy .spin{width:48px;height:48px;border:5px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:14px}@keyframes spin{to{transform:rotate(360deg)}}#busybar{width:min(420px,80vw);height:10px;background:rgba(255,255,255,.25);border-radius:5px;overflow:hidden;margin-top:12px;display:none}#busy.prog #busybar{display:block}#busyfill{height:100%;width:0;background:#4caf50;transition:width .3s}#busybar.ind #busyfill{width:30%!important;animation:ind 1.2s ease-in-out infinite}@keyframes ind{0%{margin-left:-30%}100%{margin-left:100%}}#busystage{margin-top:8px;font-size:13px;opacity:.9;min-height:1.2em}</style></head><body>
<div id=tabbar><b style="margin-right:8px" data-i18n=app.title></b><button data-t=cfg onclick="showTab('cfg')" data-i18n=tab.cfg></button><button data-t=map onclick="showTab('map')" data-i18n=tab.map></button><button data-t=rob onclick="showTab('rob')" id=tb_rob></button><button data-t=ord onclick="showTab('ord')" id=tb_ord></button>
<input type=hidden id=tab value=cfg><span id=run></span><select id=langsel onchange=setLang(this.value) title="Language / 语言"><option value=zh>中文</option><option value=en>English</option></select></div>
<div id=tab-cfg class=tab>
<div id=subbar><button data-s=conn onclick="showSub('conn')" data-i18n=sub.conn></button><button data-s=pool onclick="showSub('pool')" data-i18n=sub.pool></button><button data-s=tpl onclick="showSub('tpl')" data-i18n=sub.tpl></button><button data-s=gen onclick="showSub('gen')" data-i18n=sub.gen></button>
 <span id=cfgsum></span> <button onclick=generate() style="background:#cfc" data-i18n=gen.btn></button> <span id=genmsg2></span></div>
<fieldset class=sub data-sub=conn><legend data-i18n=cfg.legend></legend><span data-i18n=cfg.base></span> <input id=base size=28 value="http://127.0.0.1:8088"> <span data-i18n=cfg.poll></span> <input id=poll type=number value=2>
 <span data-i18n=cfg.stuck></span> <input id=stuck type=number value=60> <span data-i18n=cfg.still></span> <input id=still type=number value=60>
 <button onclick=saveCfg() data-i18n=btn.save></button> <span class=dim id=adapterinfo></span> <span data-i18n=cfg.lang></span> <select id=langsel2 onchange=setLang(this.value)><option value=zh>中文</option><option value=en>English</option></select> <span id=info></span></fieldset>
<fieldset class=sub data-sub=pool><legend data-i18n=st.legend></legend><button onclick=loadSt() data-i18n=st.load></button>
 <span data-i18n=st.search></span> <input id=q oninput=renderSt() size=12> <span data-i18n=st.type></span> <input id=tf oninput=renderSt() size=6 placeholder="AP/LM">
 <details><summary data-i18n=st.paste></summary><textarea id=paste rows=3 cols=40></textarea><button onclick=usePaste() data-i18n=btn.use></button></details>
 <small data-i18n=st.mapHint></small>
 <div id=st></div></fieldset>
<fieldset class=sub data-sub=pool><legend data-i18n=pool.legend></legend>
 <div id=pools></div>
 <span data-i18n=pool.add></span> <input id=newpool size=10 placeholder="pallet2"> <button onclick=addPool() data-i18n=btn.add></button>
 | <select id=swa></select> ⇄ <select id=swb></select> <button onclick=swapPools() data-i18n=pool.swap></button> <span class=dim data-i18n=pool.chipHint></span><br>
 <b id=poolline></b><br>
 <span data-i18n=gen.strategy></span> <select id=strategy onchange=renderPool()><option value=random data-i18n=gen.random></option><option value=round_robin data-i18n=gen.rr></option><option value=cartesian data-i18n=gen.cart></option></select>
 <label><input type=checkbox id=noself checked onchange=renderPool()><span data-i18n=gen.noself></span></label>
 <label id=noreuse_l><input type=checkbox id=noreuse checked onchange=renderPool()><span data-i18n=gen.noreuse></span></label></fieldset>
<fieldset class=sub data-sub=tpl style="border:2px solid #69c"><legend><b data-i18n=tpl.legend></b></legend>
 <span data-i18n=tpl.active></span> <select id=tpl_sel onchange=selectTpl(this.value)></select>
 <button onclick=newTpl() data-i18n=tpl.new></button> <button onclick=copyTpl() data-i18n=tpl.copy></button> <button onclick=delTpl() data-i18n=tpl.del></button>
 <button onclick="$('tpl_imp').click()" data-i18n=tpl.import></button><input type=file id=tpl_imp accept=".json" style=display:none onchange=importTpl()> <button onclick=exportTpl() data-i18n=tpl.export></button>
 | <label><input type=checkbox id=tpl_raw onchange=toggleRaw()><span data-i18n=tpl.raw></span></label> <span id=tpl_status></span><br>
 <span data-i18n=tpl.title></span> <input id=tpl_title size=60 oninput="cur.title=this.value;tplChanged()">
 <div id=tpl_form><table id=steps><thead><tr><th></th><th>#</th><th data-i18n=step.on></th><th data-i18n=step.id></th><th data-i18n=step.name></th><th data-i18n=step.loc></th><th data-i18n=step.op></th><th style="width:34%" data-i18n=step.args></th><th>variableShape<br><span class=dim>head / tail (m)</span></th><th></th></tr></thead><tbody></tbody></table>
 <button onclick=addStep() data-i18n=step.add></button> <span class=dim data-i18n=step.varHint></span></div>
 <div id=tpl_rawbox style=display:none><textarea id=tpl_json rows=22 style="width:100%;font:12px monospace" oninput=rawChanged()></textarea></div>
 <details open><summary data-i18n=tpl.preview></summary><span id=prev_info class=dim></span><pre id=tpl_prev></pre></details></fieldset>
<fieldset class=sub data-sub=gen><legend data-i18n=disp.legend></legend><span data-i18n=disp.group></span> <select id=grp data-i18n-title=disp.groupTip><option value="" data-i18n=disp.none></option></select> <span data-i18n=disp.veh></span> <input id=veh data-i18n-ph=disp.vehPh size=14> <span data-i18n=disp.pri></span> <input id=pri type=number value=1>
 <span data-i18n=disp.label></span> <input id=label size=14 placeholder="empty-pallet">
 <div class=row><div><span data-i18n=disp.preov></span><br><textarea id=pre_ov rows=4 cols=40 placeholder="AP12=LM12&#10;AP13=LM13|LM14" oninput="renderPool();renderSt();prevLater()"></textarea><div id=pre_err class=err style="white-space:pre-line"></div></div><div><span id=pre_info></span></div></div>
 <span data-i18n=gen.count></span> <input id=cnt type=number value=9 oninput="$('cnt_auto').value='0';renderPool()"><input type=hidden id=cnt_auto value=1> <button onclick="$('cnt_auto').value='1';renderPool()" data-i18n=gen.countAuto data-i18n-title=gen.countAutoTip></button> <button onclick=generate() style="background:#cfc" data-i18n=gen.btn></button> <span class=dim data-i18n=gen.hint></span> <span id=genmsg></span></fieldset>
</div>
<div id=tab-map class=tab><div id=maptool>
 <span data-i18n=map.layers></span> <label><input type=checkbox id=ly_pc checked onchange=draw()><span data-i18n=map.pc></span></label><select id=pcsize onchange=draw() data-i18n-title=map.pcSizeTip><option value=1 data-i18n=map.pcThin></option><option value=2 data-i18n=map.pcMed></option><option value=3 data-i18n=map.pcBold></option><option value=4 data-i18n=map.pcXBold></option></select> <label><input type=checkbox id=ly_rt checked onchange=draw()><span data-i18n=map.rt></span></label>
 <label><input type=checkbox id=ly_st checked onchange=draw()><span data-i18n=map.st></span></label><label><input type=checkbox id=ly_rb checked onchange=draw()><span data-i18n=map.rb></span></label>
 <button onclick=fitAll() data-i18n=map.fit></button>
 | <span data-i18n=map.click></span> <span id=pm_box></span>
 | <span data-i18n=map.upload></span> <input type=file id=smapf accept=".smap,.json" onchange=uploadSmap()> <span data-i18n=map.orPath></span> <input id=smap_path size=28 placeholder="D:\maps\xxx.smap"><button onclick=useSmapPath() data-i18n=btn.use></button>
 <span id=geominfo></span> <span id=mapsum></span></div>
<canvas id=map width=800 height=500></canvas></div>
<div id=tab-rob class=tab>
<fieldset><legend data-i18n=rob.legend></legend><button onclick="grpAll(false)" data-i18n=btn.expandAll></button> <button onclick="grpAll(true)" data-i18n=btn.collapseAll></button><div id=rt></div></fieldset></div>
<div id=tab-ord class=tab>
<fieldset><legend data-i18n=ord.drafts></legend><button onclick=selDrafts(true) data-i18n=ord.selAll></button> <button onclick=selDrafts(false) data-i18n=ord.selNone></button>
 <button onclick=sendSel() style="background:#cfc" data-i18n=ord.send></button> <span data-i18n=ord.iv></span> <input id=iv type=number value=5 step=0.5> <span data-i18n=ord.maxa></span> <input id=maxa type=number value=5> <span class=dim data-i18n=ord.zeroUnl></span>
 <button onclick=stop() style="background:#fcc" data-i18n=ord.stop></button> <button onclick=delDrafts() data-i18n=ord.del></button> <button onclick=swapDrafts() data-i18n=ord.swap></button> <span id=selinfo></span></fieldset>
<fieldset><legend data-i18n=ord.sent></legend><button onclick=cancel(false) data-i18n=ord.cancelSel></button> <button onclick=cancel(true) data-i18n=ord.cancelAll></button>
 <button onclick="if(confirm(t('ord.clearQ')))post('/api/clear',{})" data-i18n=ord.clear></button></fieldset>
<fieldset id=ofilt><legend data-i18n=f.legend></legend>
 <span data-i18n=f.state></span> <span id=f_states></span><br>
 <span data-i18n=f.veh></span> <input id=f_veh size=12 data-i18n-ph=f.contains> <span data-i18n=disp.group></span> <select id=f_grp><option value="" data-i18n=f.all></option></select>
 <span data-i18n=f.pair></span> <input id=f_st size=14 data-i18n-ph=f.pairPh> <span data-i18n=f.id></span> <input id=f_id size=14 data-i18n-ph=f.contains>
 <label><input type=checkbox id=f_stuck><span data-i18n=f.stuck></span></label> <label><input type=checkbox id=hidedone><span data-i18n=f.hide></span></label>
 <button onclick=clearFilt() data-i18n=f.clear></button> <span id=f_info class=dim></span>
 | <button onclick="grpCollapseAll(false)" data-i18n=btn.expandAll></button> <button onclick="grpCollapseAll(true)" data-i18n=btn.collapseAll></button></fieldset>
 <span id=sum></span><table id=ot></table></div>
<div id=busy role=alert aria-busy=true><div class=spin></div><div id=busytxt></div><div id=busybar><div id=busyfill></div></div><div id=busystage></div></div><script src="/static/app.js"></script>
</body></html>
