<!doctype html><html lang="zh"><head><meta charset="utf-8"><title>Order Dispatch Tester</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#eef1f6; --surface:#ffffff; --surface-2:#f7f9fc; --border:#d8dee8; --border-strong:#b8c2d1;
  --text:#1e293b; --muted:#64748b; --accent:#3b82f6; --accent-soft:#dbeafe; --accent-hover:#2563eb;
  --ok:#16a34a; --err:#dc2626; --warn:#d97706; --chip:#e2e8f0;
  --radius:8px; --radius-sm:6px; --shadow:0 1px 2px rgba(15,23,42,.06),0 1px 3px rgba(15,23,42,.04);
  --shadow-md:0 2px 8px rgba(15,23,42,.08); --side-w:220px; --side-collapsed:28px;
  --font:13px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{font:var(--font);margin:0;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
html.map-fill,body.map-fill{margin:0;height:100%;overflow:hidden}
body.map-fill #app_body{height:100%;min-height:0}
body.map-fill #app_main{min-height:0;overflow:hidden}
body.map-fill #tabbar{flex:0 0 auto;margin:0}
body.map-fill #tab-map.tab.on{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;margin:0;padding:0 10px 10px;overflow:hidden;background:transparent;border:none;box-shadow:none}
body.map-fill #maptool{flex:0 0 auto;padding:6px 0}
body.map-fill #map{flex:1 1 auto;width:100%;min-height:0;height:auto;border-radius:var(--radius);box-shadow:var(--shadow)}
body.map-fill #srv_side{max-height:none;height:100%;align-self:stretch;position:relative;top:auto}

/* shell: left rail | divider | right */
#app_body{display:flex;align-items:stretch;min-height:100vh;gap:0}
#app_main{flex:1;min-width:0;display:flex;flex-direction:column;padding:10px 12px 12px;gap:0}
#srv_side{
  width:var(--side-w);flex:0 0 var(--side-w);display:flex;flex-direction:column;
  background:var(--surface);border-right:1px solid var(--border-strong);
  box-shadow:2px 0 8px rgba(15,23,42,.04);position:sticky;top:0;
  align-self:stretch;min-height:100vh;max-height:100vh;
  transition:width .15s ease,flex-basis .15s ease;z-index:4
}
#app_brand{flex:0 0 auto;padding:12px 14px 10px;border-bottom:1px solid var(--border);background:linear-gradient(180deg,#fff 0%,var(--surface-2) 100%)}
#app_brand b{display:block;font-size:14px;font-weight:700;letter-spacing:.01em;color:var(--text);line-height:1.35}
#srv_side .srv_hd{padding:8px 12px 6px;font-weight:600;font-size:12px;text-transform:none;color:var(--muted);display:flex;align-items:center;gap:4px;flex:0 0 auto;letter-spacing:.02em}
#srv_side .srv_hd .lbl{flex:1;min-width:0}
#srv_list{list-style:none;margin:0;padding:6px;overflow:auto;flex:1;max-height:none}
#srv_list li{padding:8px 10px;cursor:pointer;border-radius:var(--radius-sm);margin-bottom:4px;border:1px solid transparent;transition:background .12s,border-color .12s,box-shadow .12s}
#srv_list li:hover{background:var(--accent-soft);border-color:#bfdbfe}
#srv_list li.on{background:var(--accent);color:#fff;font-weight:600;border-color:var(--accent);box-shadow:var(--shadow)}
#srv_list li .sn{display:block;font-weight:inherit}
#srv_list li .sb{display:block;font-size:11px;opacity:.85;font-weight:normal;word-break:break-all;margin-top:2px}
#srv_list li.on .sb{opacity:.9}
#srv_side .bar{padding:8px;border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;gap:6px;flex:0 0 auto;background:var(--surface-2)}
#srv_side .bar button,#tpl_side .bar button{font-size:12px;padding:4px 8px}
#srv_edge{
  position:absolute;top:50%;right:-12px;transform:translateY(-50%);z-index:6;
  width:20px;height:40px;padding:0;margin:0;border:1px solid var(--border-strong);
  border-radius:0 8px 8px 0;background:var(--surface);cursor:pointer;font-size:12px;line-height:1;
  color:var(--accent);box-shadow:var(--shadow-md);transition:background .12s,color .12s,border-color .12s
}
#srv_edge:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
body.srv-collapsed #srv_side{width:var(--side-collapsed);flex:0 0 var(--side-collapsed);overflow:visible;min-height:100vh;max-height:100vh}
body.srv-collapsed #srv_side #app_brand,
body.srv-collapsed #srv_side .srv_hd,
body.srv-collapsed #srv_side .bar,
body.srv-collapsed #srv_side #srv_list{display:none}
body.srv-collapsed #srv_edge{right:-1px;border-radius:0 8px 8px 0}

/* right column chrome */
#tabbar{
  display:flex;gap:4px;align-items:center;flex-wrap:wrap;
  margin:0 0 10px;padding:6px 8px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);box-shadow:var(--shadow)
}
#tabbar button{padding:6px 14px;border:1px solid transparent;border-radius:999px;background:transparent;cursor:pointer;color:var(--muted);font:inherit;transition:background .12s,color .12s,box-shadow .12s}
#tabbar button:hover{background:var(--surface-2);color:var(--text)}
#tabbar button.on{background:var(--accent);color:#fff;font-weight:600;box-shadow:0 1px 3px rgba(37,99,235,.35)}
#run{margin-left:8px;font-size:12px;color:var(--muted);flex:1;min-width:8em}
#langsel{margin-left:auto;padding:4px 6px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);font:inherit}
.tab{display:none}.tab.on{display:block}

/* panels / forms */
fieldset{margin:0 0 10px;padding:10px 12px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow)}
fieldset>legend{font-weight:600;padding:0 6px;color:var(--text)}
table{border-collapse:collapse;width:100%;background:var(--surface)}
td,th{border:1px solid var(--border);padding:5px 8px;text-align:left}
th{background:var(--surface-2);font-weight:600;color:var(--muted);font-size:12px}
tr:nth-child(even) td{background:#fafbfd}
input,select,textarea{font:inherit;border:1px solid var(--border);border-radius:var(--radius-sm);padding:4px 8px;background:#fff;color:var(--text);transition:border-color .12s,box-shadow .12s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,130,246,.2)}
input[type=number]{width:64px}
input[type=checkbox]{accent-color:var(--accent)}
button{
  font:inherit;padding:5px 11px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);
  background:linear-gradient(180deg,#fff,#f3f5f8);color:var(--text);cursor:pointer;
  transition:background .12s,border-color .12s,box-shadow .12s,color .12s
}
button:hover{background:#fff;border-color:var(--accent);color:var(--accent-hover);box-shadow:var(--shadow)}
button:active{transform:translateY(1px)}
.stuck{background:#fee2e2}.done{color:var(--muted)}
#map{display:block;background:#fafafa;cursor:crosshair;border:1px solid var(--border);border-radius:var(--radius)}
#st{height:300px;overflow:auto;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface)}
#rt table{table-layout:fixed}
.grp{background:var(--accent-soft);padding:6px 10px;margin-top:8px;cursor:pointer;font-weight:600;border:1px solid #bfdbfe;border-radius:var(--radius-sm)}
.grp .c{font-weight:normal;margin-left:10px}.dim{color:var(--muted);font-size:11px}
#maptool{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:4px 0}
#maptool label{white-space:nowrap}
.row{display:flex;gap:10px}.row>div{flex:1}
.S{color:var(--ok);font-weight:700}.E{color:var(--err);font-weight:700}
.chip{display:inline-block;margin:2px;padding:2px 2px 2px 8px;border-radius:999px;font-size:12px;cursor:pointer;border:1px solid var(--border);background:var(--surface-2);transition:box-shadow .12s,border-color .12s}
.chip:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.chip.hl{outline:2px solid #f59e0b;outline-offset:1px}
.chip i{font-style:normal;margin-left:4px;padding:0 5px;border-radius:999px;color:var(--muted)}
.chip i:hover{background:var(--err);color:#fff}
.poolrow{margin:4px 0}.poolrow .pn{display:inline-block;min-width:60px;font-weight:700}
#steps td{vertical-align:top}#steps tr.off{opacity:.5}#steps tr.drag{outline:2px dashed var(--accent)}
#steps textarea{width:100%;box-sizing:border-box;font:11px monospace}
#steps textarea.stargs{min-height:8em;height:9.5em;resize:vertical;font:12px/1.35 Consolas,Menlo,monospace;white-space:pre;tab-size:2}
#steps td:first-child{width:28px;padding:2px}
#steps td:first-child .act{display:flex;flex-direction:column;align-items:center;gap:2px}
#steps .hdl,#steps button.up,#steps button.down,#steps button.rm{
  display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;padding:0;margin:1px;
  font-size:13px;line-height:1;box-sizing:border-box;vertical-align:middle;
  border:1px solid var(--border);background:var(--surface-2);border-radius:4px
}
#steps .hdl{cursor:grab;user-select:none;color:var(--muted);border-style:dashed}#steps button.rm{color:var(--err)}
#tpl_prev{max-height:340px;overflow:auto;background:var(--surface-2);font-size:11px;margin:0;border-radius:var(--radius-sm);padding:8px;border:1px solid var(--border)}
.err{color:var(--err)}.ok{color:var(--ok)}
#subbar{
  display:flex;gap:4px;align-items:center;flex-wrap:wrap;padding:6px 8px;margin-bottom:10px;
  position:sticky;top:0;background:var(--surface);z-index:5;border:1px solid var(--border);
  border-radius:var(--radius);box-shadow:var(--shadow)
}
#subbar>button[data-s]{padding:5px 12px;border:1px solid var(--border);background:var(--surface-2);cursor:pointer;border-radius:999px;color:var(--muted)}
#subbar>button[data-s]:hover{border-color:var(--accent);color:var(--accent-hover)}
#subbar>button.on{background:var(--accent);color:#fff;font-weight:600;border-color:var(--accent)}
#cfgsum{margin-left:12px;font-size:12px;color:var(--muted)}
.sub{display:none}.sub.on{display:block}
#busy{display:none;position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:9999;align-items:center;justify-content:center;flex-direction:column;color:#fff;font-size:16px;cursor:wait;backdrop-filter:blur(2px)}
#busy.on{display:flex}
#busy .spin{width:48px;height:48px;border:5px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:14px}
@keyframes spin{to{transform:rotate(360deg)}}
#busybar{width:min(420px,80vw);height:10px;background:rgba(255,255,255,.25);border-radius:5px;overflow:hidden;margin-top:12px;display:none}
#busy.prog #busybar{display:block}#busyfill{height:100%;width:0;background:#4ade80;transition:width .3s}
#busybar.ind #busyfill{width:30%!important;animation:ind 1.2s ease-in-out infinite}
@keyframes ind{0%{margin-left:-30%}100%{margin-left:100%}}
#busystage{margin-top:8px;font-size:13px;opacity:.9;min-height:1.2em}
#tpl_layout{display:flex;gap:10px;align-items:stretch;min-height:280px}
#tpl_side{width:200px;flex:0 0 200px;border:1px solid var(--border);display:flex;flex-direction:column;background:var(--surface-2);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
#tpl_list{list-style:none;margin:0;padding:4px;overflow:auto;flex:1;max-height:60vh}
#tpl_list li{padding:6px 10px;cursor:pointer;border-radius:var(--radius-sm);margin-bottom:2px}
#tpl_list li:hover{background:var(--accent-soft)}
#tpl_list li.on{background:var(--accent);color:#fff;font-weight:600}
#tpl_side .bar{padding:6px;border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;gap:4px;background:var(--surface)}
#tpl_main{flex:1;min-width:0}
#steps.no-vs .vs-col{display:none}
#steps tr.om-bin .stargs,#steps tr.om-bin .argerr{display:none}
#steps tr.om-bin td.stargs-td::after{content:"—";color:var(--muted);font-size:12px}
#cfg_main{min-width:0}
#m4box{background:var(--surface-2)!important;border-radius:var(--radius-sm)!important;border-color:var(--border)!important}
details{margin:6px 0}summary{cursor:pointer;color:var(--accent-hover)}
#ver_footer{
  position:fixed;left:10px;bottom:8px;z-index:50;
  pointer-events:none;user-select:none;
  font-size:11px;line-height:1.3;color:var(--muted);
  opacity:.85;text-shadow:0 0 4px var(--bg),0 0 2px var(--bg);
}
</style></head><body>
